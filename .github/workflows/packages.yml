name: Packages

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      update:
        description: Update flake inputs and application versions before building
        type: boolean
        default: false
      cache_backfill:
        description: Upload every current package to Attic, including cached outputs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

env:
  ATTIC_SERVER: https://cache.455500.xyz/
  ATTIC_CACHE: nix-packages

jobs:
  evaluate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      build: ${{ steps.select.outputs.build }}
      update: ${{ steps.update.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.ATTIC_PUBLIC_KEY != '' && 'https://cache.455500.xyz/nix-packages' || '' }}
            extra-trusted-public-keys = ${{ vars.ATTIC_PUBLIC_KEY }}

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        # Select work from the public caches; a CI-only hit still needs publishing.
        if: vars.ATTIC_PUBLIC_KEY == ''

      - uses: cachix/cachix-action@v17
        if: >-
          vars.CACHIX_CACHE_NAME != '' &&
          (vars.ATTIC_PUBLIC_KEY == '' || (github.event_name == 'workflow_dispatch' && inputs.cache_backfill))
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: Update upstream versions
        id: update
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix flake update
          ./scripts/update-all.sh

      - name: Check formatting and update scripts
        run: |
          nix fmt -- --check .
          for script in scripts/*.sh; do bash -n "$script"; done
          ./scripts/test-update-neiro.sh
          ./scripts/test-update-all.sh
          ./scripts/test-select-builds.sh
          ./scripts/test-push-attic.sh
          nix flake check --no-build

      - name: Select uncached outputs
        id: select
        env:
          CACHE_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_backfill }}
          ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
        run: |
          if [[ "$CACHE_BACKFILL" == true && -z "$ATTIC_PUBLIC_KEY" ]]; then
            echo 'Set ATTIC_PUBLIC_KEY and ATTIC_TOKEN before requesting an Attic backfill.' >&2
            exit 1
          fi
          ./scripts/select-builds.sh > "$RUNNER_TEMP/builds.json"
          cat "$RUNNER_TEMP/builds.json"
          echo "build=$(jq '.matrix | length > 0' "$RUNNER_TEMP/builds.json")" >> "$GITHUB_OUTPUT"
          # Keep the matrix valid even when every output is cached.
          echo "matrix=$(jq -c 'if .matrix == [] then [{attr: "cached"}] else .matrix end' "$RUNNER_TEMP/builds.json")" >> "$GITHUB_OUTPUT"

      - name: Snapshot evaluated sources
        run: git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/sources.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: evaluated-sources
          path: ${{ runner.temp }}/sources.tar.gz
          retention-days: 1

  build:
    needs: evaluate
    if: needs.evaluate.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Two runners, one upload each by default, bound writes to the small VPS.
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.evaluate.outputs.matrix) }}
    name: Build (${{ matrix.attr }})
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: evaluated-sources
          path: ${{ runner.temp }}

      - name: Restore evaluated sources
        run: tar -xzf "$RUNNER_TEMP/sources.tar.gz"

      - uses: cachix/install-nix-action@31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = ${{ vars.ATTIC_PUBLIC_KEY != '' && 'https://cache.455500.xyz/nix-packages' || '' }}
            extra-trusted-public-keys = ${{ vars.ATTIC_PUBLIC_KEY }}

      - uses: DeterminateSystems/magic-nix-cache-action@v15

      - uses: cachix/cachix-action@v17
        if: >-
          vars.CACHIX_CACHE_NAME != '' &&
          (vars.ATTIC_PUBLIC_KEY == '' || (github.event_name == 'workflow_dispatch' && inputs.cache_backfill))
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          skipPush: true

      - name: Build output
        env:
          INSTALLABLE: ${{ matrix.installable }}
        run: nix build --no-link --print-build-logs "${INSTALLABLE}^*"

      - name: Check sandbox permissions
        if: matrix.policy
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          nix run '.#checks.x86_64-linux.jailed-desktop-policy'

      - name: Push successful outputs to Attic
        if: >-
          !matrix.policy && github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          vars.ATTIC_PUBLIC_KEY != ''
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          ATTIC_PUSH_JOBS: ${{ vars.ATTIC_PUSH_JOBS || '1' }}
          OUTPUT_PATHS: ${{ toJSON(matrix.outPaths) }}
        run: |
          set -euo pipefail
          : "${ATTIC_TOKEN:?Set the ATTIC_TOKEN repository secret}"
          echo 'Preparing Attic client...'
          nix profile add --inputs-from . --no-write-lock-file 'nixpkgs#attic-client'
          ./scripts/push-attic.sh

      - name: Push successful outputs to Cachix before Attic is configured
        if: >-
          !matrix.policy && github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          vars.ATTIC_PUBLIC_KEY == '' && vars.CACHIX_CACHE_NAME != ''
        env:
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          OUTPUT_PATHS: ${{ toJSON(matrix.outPaths) }}
        run: |
          if [[ -n "$CACHIX_AUTH_TOKEN" ]]; then
            jq -r '.[]' <<< "$OUTPUT_PATHS" | cachix push "$CACHIX_CACHE_NAME"
          fi

  commit-updates:
    needs: [evaluate, build]
    if: >-
      always() && needs.evaluate.result == 'success' &&
      needs.evaluate.outputs.update == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8
        with:
          name: evaluated-sources
          path: ${{ runner.temp }}

      - name: Commit validated updates
        env:
          UPDATE_BRANCH: ${{ github.ref_name }}
        run: |
          tar -xzf "$RUNNER_TEMP/sources.tar.gz"
          git add flake.lock packages
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update package versions'
          git push origin "HEAD:$UPDATE_BRANCH"
